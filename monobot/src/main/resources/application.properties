# What one run is allowed to do. Every one of these is a default: a system
# property or an environment variable of the same name wins over it.
#
# mode says what the run does with the catalog it is pointed at. generate writes
# it, check compares against what is committed and writes nothing, fetch only
# fills the cache. The expensive half is the same in all three, which is why
# they are one program: a cold fetch is gigabytes and the two after it are not.
mode=generate
#
# maxConcurrentDownloads caps requests in flight across the whole scan rather
# than per extension, because a scan starts every extension at once and each of
# them every one of its versions, so a per-extension cap would multiply by the
# number of configs. The forges rate limit anonymous callers, which is what the
# cap is for.
maxConcurrentDownloads=4
# One request, from send to the last byte of the response.
downloadTimeout=PT5M
# One tag listing, applied as both the connect and the read timeout. JGit leaves
# this at zero unless told otherwise and zero means no bound at all, so a forge
# that completes the handshake and then answers nothing would hold the call for
# as long as the process lives. Counted in whole seconds by the transport.
tagListTimeout=PT30S
# The whole scan. The main thread blocks until every extension has settled and
# nothing else settles that, so this is the only bound on the process. Raise it
# alongside the config tree: the worst case a run can legitimately take is
# ceil(downloads / maxConcurrentDownloads) * downloadTimeout, so an hour covers
# a handful of extensions and not hundreds.
runTimeout=PT1H
# How much of a cached archive is checked before a run answers from it. size
# compares the file's length against the length recorded for it, which is one
# stat call per version and catches every way a write stops partway. digest
# compares the file's digest, which is exact and reads the whole cache off the
# disk on every run. none takes the record at its word.
verifyCache=size
# Whether to ask the source about archives the cache can already answer for. The
# request carries the validators the cache recorded, so an archive that has not
# changed costs a 304 rather than the whole file. Off, because the versions this
# catalog names are tags and a tag that moves is a tag that lied.
refreshCache=false

# Build arguments for //:monobot_native that follow from what the application
# depends on, and so hold for every target architecture. The ones that describe
# the libc and the link instead live in //:monobot, which can select() on the
# platform; a properties file cannot.
#
# Each entry defers a class that native-image would otherwise initialize while
# building the image, against the wishes of the jar that declares it. Each is a
# static initializer that runs eagerly during the build: netty's zstd and TLS
# helpers parse a certificate, and the two vert.x classes allocate a Buffer,
# which drags in the whole netty allocator hierarchy.
quarkus.native.additional-build-args=\
  --initialize-at-run-time=io.netty.handler.codec.compression.ZstdConstants,\
  --initialize-at-run-time=io.netty.handler.ssl.JdkSslServerContext,\
  --initialize-at-run-time=io.vertx.core.buffer.impl.VertxByteBufAllocator,\
  --initialize-at-run-time=io.vertx.core.eventbus.impl.clustered.ClusteredEventBus,\
  --initialize-at-run-time=io.vertx.core.http.impl.VertxHttp2ClientUpgradeCodec
