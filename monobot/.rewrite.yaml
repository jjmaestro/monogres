type: specs.openrewrite.org/v1beta/style
name: dev.monogres.monobot.Style
styleConfigs:
  - org.openrewrite.java.style.ImportLayoutStyle:
      # google-java-format emits one alphabetised block and never a wildcard.
      # Matching that here keeps OpenRewrite and spotless from undoing each
      # other's import layout on every run.
      classCountToUseStarImport: 999
      nameCountToUseStarImport: 999
      layout:
        # A layout with no static block gives `import static` nowhere to go, and
        # OrderImports then drops it, leaving the file unresolvable. Static goes
        # first, matching where google-java-format puts it.
        - import static all other imports
        - <blank line>
        - import all other imports
---
type: specs.openrewrite.org/v1beta/recipe
name: dev.monogres.monobot.CodeStyle
displayName: monobot code style
description: >-
  The google_checks.xml rules a formatter cannot satisfy on its own, because
  they change the tree rather than its layout: giving a single-statement
  branch a block, and unfolding a wildcard import into the types the file
  actually uses.
recipeList:
  - org.openrewrite.staticanalysis.NeedBraces
  - org.openrewrite.java.OrderImports:
      removeUnused: true
  # Roughly fifty cleanups that are safe to apply without review: redundant
  # modifiers, constructors on abstract classes that cannot be called
  # publicly, and similar. It subsumes NeedBraces, which is kept above so the
  # rule this project actually depends on is named rather than implied.
  - org.openrewrite.staticanalysis.CommonStaticAnalysis
