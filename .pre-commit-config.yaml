# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
default_stages:
  - pre-commit
default_language_version:
  python: system
exclude: >-
  (?x)^(
    .*\.(patch|diff)$
    |.*\.lock$
    |.*/introspect/.*\.json$
    |.*/config_headers/.*\.h$
    |rbe/auth/.*\.json$
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: >-
          (?x)^(
            build/docs/.*/.*\.md
            |build/.*/docs/.*/.*\.md
          )$
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/crate-ci/typos
    rev: v1.45.1
    hooks:
      - id: typos
        args: [--config, .typos.toml]
        exclude: >-
          (?x)^(
            ^\.typos\.toml$
          )$
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.10
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: >-
          (?x)^(
            build/docs/.*/.*\.md
            |build/.*/docs/.*/.*\.md
          )$
  - repo: https://github.com/mpalmer/action-validator
    rev: v0.9.0
    hooks:
      - id: action-validator
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        name: ruff-check
        args: [--config, .ruff.toml, --fix]
      - id: ruff-format
        args: [--config, .ruff.toml]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--enable=all]
  - repo: https://github.com/mrtazz/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
  - repo: local
    hooks:
      - id: bzl-docstring-lint
        name: bzl-docstring-lint
        entry: .pre-commit-hooks/bzl-docstring-lint.py
        args:
          - --fix
        language: system
        types: [file]
        files: \.(bzl|bazel)$
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.1
    hooks:
      - id: buildifier
        args: &args
          - --warnings=all
      - id: buildifier-lint
        args: *args
  - repo: https://github.com/waisbrot/pre-commit-jsonnet.git
    rev: v1.0
    hooks:
      - id: jsonnetfmt
  - repo: local
    hooks:
      - id: bazel-query
        name: bazel-query
        entry: >-
          make -C build/docker exec-image
            RUN_MODE=-i
            EXEC_CMD=/src/repo/.pre-commit-hooks/bazel-all-modules.sh
        args:
          - EXEC_ARGS=query //...
        language: system
        pass_filenames: false
        verbose: false
      - id: bazel-analyze
        name: bazel-analyze
        entry: >-
          make -C build/docker exec-image
            RUN_MODE=-i
            EXEC_CMD=/src/repo/.pre-commit-hooks/bazel-all-modules.sh
        args:
          - EXEC_ARGS=build --nobuild //...
        language: system
        pass_filenames: false
        verbose: false
        stages: [manual]
      - id: bazel-test-all
        name: bazel-test-all
        entry: >-
          make -C build/docker exec-image
            RUN_MODE=-i
            EXEC_CMD=/src/repo/.pre-commit-hooks/bazel-all-modules.sh
        args:
          - EXEC_ARGS=test //...
        language: system
        pass_filenames: false
        verbose: false
        stages: [manual]
